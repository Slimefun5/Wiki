name: Deploy Wiki to GitHub Pages

on:
  push:
    branches:
      - stable
  workflow_dispatch:

# Needs to push the built site to the gh-pages branch.
permissions:
  contents: write

# Only one deploy at a time; let a running one finish.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch core item names (for /Wiki/<plugin>/<id> redirects)
        run: |
          curl -sfL \
            https://raw.githubusercontent.com/Slimefun5/Slimefun5/stable/core/src/main/resources/languages/en/items.yml \
            -o items.yml || echo "items.yml unavailable - building without item redirects"

      - name: Generate the Jekyll site
        run: |
          python3 src/generate-wiki.py \
            --pages pages \
            --items items.yml \
            --plugin slimefun \
            --base /Wiki \
            --out _src

      # Publish the Jekyll SOURCE to gh-pages; GitHub Pages runs Jekyll on the branch itself (the same
      # legacy-branch method the builds page uses). No local Jekyll build, so no container/ownership issues.
      - name: Publish to gh-pages
        run: |
          cd _src
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "deploy: regenerate wiki site"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages:gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
